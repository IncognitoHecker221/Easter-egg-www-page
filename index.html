<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wszystkiego najlepszego z okazji Wielkanocy!</title>
    <style>
        /* Styl dla całej strony - wielkanocne, jasne tło */
        body {
            background-color: #f4f9f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Styl dla ramki z życzeniami */
        .wielkanoc-card {
            background-color: white;
            border: 4px dashed #ffcc00; /* Żółta, przerywana ramka */
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        /* Główny nagłówek */
        h1 {
            color: #2e7d32; /* Zielony wielkanocny */
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        /* Tekst życzeń */
        .zyczenia {
            font-size: 1.4em;
            line-height: 1.8;
            color: #e65100; /* Ciepły pomarańczowy */
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* Informacje dla nauczyciela (stopka) */
        footer {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            color: #555;
            font-size: 1em;
        }

        .klasa {
            color: #0288d1;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="wielkanoc-card">
        <h1>Wszystkiego najlepszego<br>z okazji Wielkanocy!</h1>
       
        <p class="zyczenia">
            Dużo jajek, dużo miłości oraz szczęścia i pomyślności.<br>
            A także królików, dużo piękności oraz mądrości i grzeczności.
        </p>

        <footer>
            <p>Strona do oceny przez <strong>panią Agnieszkę</strong> z informatyki</p>
            <p class="klasa">Klasa 4</p>
            <p><em>Autor: [Tutaj wpisz swoje Imię i Nazwisko]</em></p>
        </footer>
    </div>

</body>
</html>
